name: خريطة الهطول المطري
on:
  schedule:
    - cron: "12 */3 * * *"     # كل 3 ساعات
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rainmap
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: استرجاع الحالة
        run: |
          mkdir -p state
          git fetch -q --depth=1 origin data && git archive FETCH_HEAD | tar -x -C state || echo "أول تشغيل"
      - name: بناء الموقع
        env:
          OPENMETEO_KEY: ${{ secrets.OPENMETEO_KEY }}
        run: |
          mkdir -p site
          python rainmap.py --state state --out site
      - name: حفظ الحالة
        run: |
          D=$(mktemp -d)
          cp state/*.npz state/stamp.json "$D/" || true
          cd "$D"
          git init -q -b data
          git config user.name rain-bot
          git config user.email bot@users.noreply.github.com
          git add .
          git commit -qm state
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
